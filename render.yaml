services:
  - type: web
    name: shorter-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: API_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: shorter-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shorter-redis
          property: connectionString

  - type: worker
    name: shorter-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLICK_BATCH_SIZE
        value: "100"
      - key: DATABASE_URL
        fromDatabase:
          name: shorter-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shorter-redis
          property: connectionString

  - type: web
    name: shorter-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerBuildArgs:
      - name: VITE_API_BASE_URL
        value: https://shorter-api.onrender.com

databases:
  - name: shorter-postgres
    plan: free

  - name: shorter-redis
    type: redis
    plan: free
